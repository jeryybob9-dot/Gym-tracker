<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Novo Tracker</title>
  <meta name="description" content="Gym progress tracker: log sets, reps and weight, chart your lifts over time and track bench press PRs.">
  <meta name="theme-color" content="#07080b">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Novo Tracker">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main id="view" class="view"></main>
  <nav id="tabbar" class="tabbar" aria-label="Main"></nav>
  <div id="rest" class="rest rest-dock rest-ui" role="timer" aria-label="Rest timer" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">Novo Tracker needs JavaScript turned on.</p></noscript>
</body>
</html>
